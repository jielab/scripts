name: allele3-evolution
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - bcftools>=1.18
  - samtools>=1.18
  - pysam>=0.22
  - htslib>=1.18
  - matplotlib>=3.7
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - statsmodels>=0.14,<0.16
  - pyreadr>=0.5,<0.6
  - pybigwig>=0.3.22
  - openpyxl>=3.1
  - plotly>=5.20,<8
  - plink2
  - zstandard
  - repeatmasker=4.2.4
  - rmblast=2.17.0
  - famdb=3.0.0
  - trf=4.10.0rc2
  - h5py
  - pip
  - pip:
      - pyliftover==0.4.1
      - pgenlib==0.95.1
# Shared environment for allele3.sh, 1.ancient_pca.sh, 2.herv_scan.sh,
# 3.allele3_scan.sh and 4.avi_scan.sh. Existing optional analysis dependencies
# remain available for the historical downstream modules.
# pandas also supports the included offline cohort review script.
# 0.alphag2vcf.py and 4.avi_scan.sh compile C++17/zlib workers. Install g++ and
# zlib development headers on Linux (or provide --native-binary). htslib supplies
# threaded bgzip; pysam BGZF is an automatic slower fallback.
# Optional online stage only:
# python -m pip install alphagenome==0.10.0
