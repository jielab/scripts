name: allele3-evolution
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - bcftools>=1.18
  - samtools>=1.18
  - pysam>=0.22
  - htslib>=1.18
  - matplotlib>=3.7
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - statsmodels>=0.14,<0.16
  - pyreadr>=0.5,<0.6
  - pybigwig>=0.3.22
  - openpyxl>=3.1
  - plotly>=5.20,<8
  - plink2
  - zstandard
  - repeatmasker=4.2.4
  - rmblast=2.17.0
  - famdb=3.0.0
  - trf=4.10.0rc2
  - h5py
  - pip
  - pip:
      - pyliftover==0.4.1
      - pgenlib==0.95.1
# Shared environment for allele3.sh, 1.pca_3D.sh, 2.herv_census.sh, 3.scan.sh and 4.assoc.sh.
# assoc uses statsmodels for Cox/logistic regression and pyreadr for read-only LE8 RDS input.
# pandas also supports the included offline cohort review script.
# split2vcf.sh additionally compiles a C++17/zlib worker once. Install g++ and
# zlib development headers on Linux (or provide --native-binary). htslib supplies
# threaded bgzip; pysam BGZF is an automatic slower fallback.
# Optional online stage only:
# python -m pip install alphagenome==0.10.0
