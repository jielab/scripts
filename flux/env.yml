# Alternative to install.sh: conda env create -f env.yml
# PyPI-selected Torch build. install.sh explicitly chooses CPU or CUDA 11.8.
name: flux
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.14.1
      - scikit-learn==1.5.2
      - PyYAML==6.0.2
      - joblib==1.4.2
      - lightgbm==4.6.0
      - torch==2.6.0
