# Optional standalone environment. Prefer ./install.sh run to reuse ai.
# PyPI-selected Torch build; existing ai Torch is preserved by install.sh.
name: flux
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy>=1.26.4,<3
      - pandas>=2.2.3,<3
      - scipy>=1.14.1,<2
      - scikit-learn>=1.5.2,<2
      - PyYAML>=6.0.2,<7
      - joblib>=1.5.3,<2
      - lightgbm>=4.6.0,<5
      - matplotlib>=3.9.4,<4
      - torch>=2.7.1,<3
