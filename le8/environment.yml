name: le8
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - pip
  - plink=1.90
  - plink2
  - numpy=2.3.5
  - scipy=1.16.3
  - pandas=2.2.3
  - pyarrow=24.0.0
  # Required by the integrated MR-link-2 implementation in f/c2_mr_link2.py.
  - bitarray=3.8.0
  - duckdb=1.1.3
  - rpy2=3.6.7
  - r-base>=4.3
  - r-data.table
  - r-dplyr
  - r-tidyr
  - r-purrr
  - r-stringr
  - r-tibble
  - r-ggplot2
  - r-ggrepel
  - r-patchwork
  - r-survival
  - r-scales
  - r-openxlsx
  - r-forcats
  - r-broom
  - r-coloc
  - r-glmnet
  - r-lightgbm
  - r-ggalluvial
  - r-gprofiler2
  - r-proc
  - r-remotes
  - r-igraph
  - bioconductor-qvalue
  - pip:
      - setuptools<82
      - torch==2.12.0
      - gpu-coloc==0.6.5
