name: diet
channels:
  - conda-forge
dependencies:
  # Linux/WSL bootstrap. Run ./install.sh --install afterward for the remaining
  # CRAN/GitHub packages and Python requirements; nothing is installed at run time.
  - python=3.11
  - pip
  - r-base=4.5
  - r-remotes
  - r-biocmanager
  - r-tidyverse
  - r-data.table
  - r-readxl
  - r-haven
  - r-r.utils
  - r-survival
  - r-survey
  - r-rms
  - r-openxlsx
  - r-writexl
  - r-flextable
  - r-gtsummary
  - r-mediation
  - r-lavaan
  - r-igraph
  - r-sf
  - r-raster
  # Compilers and headers also support R source packages and optional Rcpp code.
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - cmake
  - pkg-config
  - git
  # Software OpenGL for MRI rendering on CPU-only/headless nodes.
  - mesalib=24.3.4
  - libcurl
  - openssl
  - libxml2
  - cairo
  - harfbuzz
  - fribidi
  - fontconfig
  - freetype
  - libpng
  - libjpeg-turbo
  - libtiff
  - gdal
  - geos
  - proj
  - udunits2
