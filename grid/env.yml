name: grid
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - scipy>=1.13,<2
  - scikit-learn>=1.4,<2
  - h5py>=3.10
  - joblib>=1.3
  - threadpoolctl>=3.2
  - pyyaml>=6
  - matplotlib>=3.8
  - zstd
  - zstandard
  - plink2
  - r-base>=4.3,<5
  - r-data.table
  - r-ggplot2
  - r-openxlsx
  - r-patchwork
  - r-mass
  - r-glmnet
  - r-jsonlite
  - lightgbm
  - pip
  - pip:
    - pgenlib==0.95.2
# PRSformer GPU dependencies (PyTorch/CUDA/NATTEN) must match the official
# checkout and the host GPU. They are intentionally a separate optional setup.
