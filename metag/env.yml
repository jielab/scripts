# Shared installation dependencies for local and HPC execution.
# conda env create -f env.yml
# Then run install.sh to build the pinned Kraken native extensions from $DIR_SOFTWARE/metag/.
name: metag
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pyyaml>=6.0 # pip:bootstrap
  - cxx-compiler
  - make
  - zlib
  - perl
  - gzip
  - bzip2
  - curl
  - tar
  - coreutils
  - util-linux
