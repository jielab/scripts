# QiMing example, based on the supplied 2026.1 cluster sheet.
# Roots come from 0f/0os.sh; all preparation and analysis starts fresh.
# No TaiYi analysis output or legacy cache is required.
# Scratch expires after 8 days; copy results needed longer to persistent storage.

schema: 1
# Explicit user deployment choice; scratch expires after 8 days.
allow_scratch: true
root: "{dir_data}"
reference_raw: "{metag_reference_raw}"
metadata_dir: "{metag_state}/metadata"
library_dir: "{metag_state}/lib"
reads_raw: "{metag_reads_raw}"
output_dir: "{metag_state}/split"
work_dir: "{metag_state}/work"
tools_dir: "{metag_tools}"
legacy_library_dir: null
legacy_metadata_dir: null
database_layout: partitioned
parallel_reference_dir: null
reference_taxid_map: null
prepare_target_gib: 2
prepare_max_files: 1000
prepare_threads: 8
prepare_concurrency: 16
prepare_queue: '${HPC_MEDIUM_QUEUE}'
prepare_cores: 8
prepare_memory_gib: 64
prepare_hours: 120
setup_queue: '${HPC_CPU_QUEUE}'
setup_cores: 8
setup_memory_gib: 32
setup_hours: 48
build_queue: '${HPC_HUGEMEM_QUEUE}'
build_cores: 64
build_threads: 64
build_memory_gib: 1792
build_hours: 120
build_soft_hours: 110
checkpoint_headroom_hours: 10
checkpoint_hours: 4
category_resources:
  viruses: {queue: '${HPC_CPU_QUEUE}', cores: 8, threads: 8, memory_gib: 48, hours: 120}
  microbes: {queue: '${HPC_MEDIUM_QUEUE}', cores: 32, threads: 32, memory_gib: 448, hours: 120}
  plants: {queue: '${HPC_HIGHMEM_QUEUE}', cores: 64, threads: 64, memory_gib: 896, hours: 120}
  invertebrates: {queue: '${HPC_HIGHMEM_QUEUE}', cores: 64, threads: 64, memory_gib: 896, hours: 120}
  vertebrates: {queue: '${HPC_HUGEMEM_QUEUE}', cores: 64, threads: 64, memory_gib: 1792, hours: 120}
# Queries must fit the SUM of category hashes. Capacity is checked after build.
# If 1792 GiB is insufficient, use profiles/qiming.6t-query.yml.
classify_queue: '${HPC_HUGEMEM_QUEUE}'
classify_cores: 32
classify_threads: 30
classify_workers: 1
classify_memory_gib: 1792
classify_hours: 120
classify_concurrency: 2
sample_batch_size: 8
worker_memory_gib: 8
system_reserve_gib: 64
memory_accounting: conservative
pilot_fragments: 1000000
masking: true
confidence: 0.1
minimum_hit_groups: 2
minimum_base_quality: 0
output_format: tar
min_free_gib: 100
lsf_memory_scope: host
lsf_resource_reserve_per_task: null
max_array_size: 100
classifier_engine: kraken
kunpeng_install_mode: binary
kunpeng_binary: null
kunpeng_cargo: null
kunpeng_hash_capacity: 1073741824
kunpeng_input_compression: gzip
kunpeng_buffer_bytes: 16777216
kunpeng_batch_size: 4
kunpeng_max_work_gib: 256
convert_queue: '${HPC_MEDIUM_QUEUE}'
convert_cores: 40
convert_memory_gib: 160
convert_hours: 72
kunpeng_full_queue: '${HPC_HUGEMEM_QUEUE}'
kunpeng_full_cores: 32
kunpeng_full_threads: 30
kunpeng_full_workers: 1
kunpeng_full_memory_gib: 4096
kunpeng_full_hours: 168
kunpeng_full_concurrency: 2
kunpeng_memory_queue: '${HPC_CPU_QUEUE}'
kunpeng_memory_cores: 24
kunpeng_memory_threads: 16
kunpeng_memory_workers: 1
kunpeng_memory_memory_gib: 128
kunpeng_memory_hours: 72
kunpeng_memory_concurrency: 8
kunpeng_memory_reserve_gib: 16
compare_threads: 16
compare_cores: 24
compare_repeats: 2
compare_fragments: 1000000
compare_concurrency_full: 2
compare_concurrency_memory: 4
compare_summary_queue: '${HPC_CPU_QUEUE}'
compare_summary_cores: 2
compare_summary_memory_gib: 16
compare_summary_hours: 24
compare_placement: matched
build_kunpeng: false
