# Shared options for the four reference downloads; input/session/log are per command.
max-concurrent-downloads=8
max-connection-per-server=4
split=4
min-split-size=16M
continue=true
always-resume=true
auto-file-renaming=false
allow-overwrite=false
file-allocation=none
max-tries=10
retry-wait=10
connect-timeout=30
timeout=60
# Empty proxy overrides must be passed on the command line to override proxy environment variables.
check-certificate=true
save-session-interval=60
log-level=notice
console-log-level=warn
summary-interval=10
max-download-result=100
