# clean restart defaults
DIR_REF=/mnt/f/annot/metag/raw
DIR_META=/mnt/f/annot/metag/0.metadata
DIR_LIB=/mnt/f/annot/metag/lib
DIR_RAW=/mnt/f/metag/raw
DIR_SPLIT=/mnt/f/metag/split
DIR_OUT=/mnt/d/analysis/metag

THREADS=16
SOURMASH_BUILD_WORKERS=16
PART_COMPRESSED_GIB=3
SOURMASH_K=31
SOURMASH_SCALED=1000

# Exclude references only when the missing taxid is confirmed in delnodes.dmp.
# Original FASTA is retained; exclusions are recorded under lib/reference.
DELETED_TAXID_POLICY=exclude

# Reference source files are immutable/retained.
KEEP_REFERENCE_FASTA=TRUE

# New defaults added by replace_metag.sh; existing values above are retained.
QUERY_BATCH_SIZE=4096
QUERY_CACHE=auto
QUERY_CACHE_GIB=100
MIN_FREE_GIB=20
